      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>
    <linearGradient id="gs-card-border" x1="0" y1="0" x2="300" y2="230" gradientUnits="userSpaceOnUse">
