<svg xmlns="http://www.w3.org/2000/svg" width="830" height="200" viewBox="0 0 830 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="50%" style="stop-color:#bc8cff"/>
      <stop offset="100%" style="stop-color:#f778ba"/>
    </linearGradient>
    <linearGradient id="subtitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#79c0ff"/>
      <stop offset="100%" style="stop-color:#d2a8ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="830" height="200" rx="12" fill="url(#bg)"/>

  <!-- Border glow -->
  <rect width="828" height="198" x="1" y="1" rx="11" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.3"/>

  <!-- Decorative dots pattern -->
  <g opacity="0.06">
    <circle cx="50" cy="30" r="1.5" fill="#58a6ff"/>
    <circle cx="80" cy="30" r="1.5" fill="#58a6ff"/>
    <circle cx="110" cy="30" r="1.5" fill="#58a6ff"/>
    <circle cx="50" cy="55" r="1.5" fill="#58a6ff"/>
    <circle cx="80" cy="55" r="1.5" fill="#58a6ff"/>
    <circle cx="110" cy="55" r="1.5" fill="#58a6ff"/>
    <circle cx="720" cy="140" r="1.5" fill="#f778ba"/>
    <circle cx="750" cy="140" r="1.5" fill="#f778ba"/>
    <circle cx="780" cy="140" r="1.5" fill="#f778ba"/>
    <circle cx="720" cy="165" r="1.5" fill="#f778ba"/>
    <circle cx="750" cy="165" r="1.5" fill="#f778ba"/>
    <circle cx="780" cy="165" r="1.5" fill="#f778ba"/>
  </g>

  <!-- Accent line top -->
  <rect x="40" y="0" width="750" height="2" rx="1" fill="url(#accent)" opacity="0.5"/>

  <!-- Main name -->
  <text x="415" y="72" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="36" font-weight="700" fill="url(#accent)" text-anchor="middle" filter="url(#glow)">
    Sowndhar A
  </text>

  <!-- Role / Tagline -->
  <text x="415" y="105" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="16" font-weight="400" fill="url(#subtitleGrad)" text-anchor="middle" letter-spacing="2">
    AI/ML Engineer  •  Full-Stack Developer  •  UI/UX Designer
  </text>

  <!-- Description -->
  <text x="415" y="140" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">
    Building intelligent applications &amp; modern web experiences
  </text>

  <!-- Social links bar -->
  <g transform="translate(415, 170)" text-anchor="middle">
    <text font-family="'Segoe UI', Ubuntu, sans-serif" font-size="11" fill="#58a6ff" letter-spacing="4">
      RESUME  ·  CODOLIO  ·  PORTFOLIO  ·  LINKEDIN
    </text>
  </g>

  <!-- Accent line bottom -->
  <rect x="40" y="198" width="750" height="2" rx="1" fill="url(#accent)" opacity="0.5"/>

  <!-- Animated shimmer effect -->
  <rect x="0" y="0" width="830" height="200" rx="12" fill="url(#accent)" opacity="0.02">
    <animate attributeName="opacity" values="0.02;0.05;0.02" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
