<svg xmlns="http://www.w3.org/2000/svg" width="830" height="120" viewBox="0 0 830 120">
  <defs>
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="footAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="50%" style="stop-color:#bc8cff"/>
      <stop offset="100%" style="stop-color:#f778ba"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="830" height="120" rx="12" fill="url(#footBg)"/>
  <rect width="828" height="118" x="1" y="1" rx="11" fill="none" stroke="url(#footAccent)" stroke-width="1" opacity="0.2"/>

  <!-- Quote / About -->
  <text x="415" y="40" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle" font-style="italic">
    "Passionate about turning innovative ideas into real-world applications"
  </text>

  <!-- Tech stack icons as text badges -->
  <g transform="translate(415, 72)" text-anchor="middle">
    <!-- Python -->
    <rect x="-390" y="-14" width="60" height="22" rx="11" fill="#3776AB" opacity="0.2"/>
    <text x="-360" y="2" font-family="'Segoe UI', sans-serif" font-size="10" fill="#79c0ff" text-anchor="middle">Python</text>

    <!-- TypeScript -->
    <rect x="-320" y="-14" width="78" height="22" rx="11" fill="#3178C6" opacity="0.2"/>
    <text x="-281" y="2" font-family="'Segoe UI', sans-serif" font-size="10" fill="#79c0ff" text-anchor="middle">TypeScript</text>

    <!-- JavaScript -->
    <rect x="-232" y="-14" width="72" height="22" rx="11" fill="#F7DF1E" opacity="0.15"/>
    <text x="-196" y="2" font-family="'Segoe UI', sans-serif" font-size="10" fill="#e3b341" text-anchor="middle">JavaScript</text>

    <!-- HTML -->
    <rect x="-150" y="-14" width="48" height="22" rx="11" fill="#E34F26" opacity="0.2"/>
    <text x="-126" y="2" font-family="'Segoe UI', sans-serif" font-size="10" fill="#f97583" text-anchor="middle">HTML</text>

    <!-- CSS -->
    <rect x="-92" y="-14" width="42" height="22" rx="11" fill="#1572B6" opacity="0.2"/>
    <text x="-71" y="2" font-family="'Segoe UI', sans-serif" font-size="10" fill="#79c0ff" text-anchor="middle">CSS</text>

    <!-- React -->
    <rect x="-40" y="-14" width="52" height="22" rx="11" fill="#61DAFB" opacity="0.15"/>
    <text x="-14" y="2" font-family="'Segoe UI', sans-serif" font-size="10" fill="#56d4dd" text-anchor="middle">React</text>

    <!-- FastAPI -->
    <rect x="22" y="-14" width="58" height="22" rx="11" fill="#009688" opacity="0.2"/>
    <text x="51" y="2" font-family="'Segoe UI', sans-serif" font-size="10" fill="#56d4dd" text-anchor="middle">FastAPI</text>

    <!-- ML/AI -->
    <rect x="90" y="-14" width="48" height="22" rx="11" fill="#bc8cff" opacity="0.2"/>
    <text x="114" y="2" font-family="'Segoe UI', sans-serif" font-size="10" fill="#d2a8ff" text-anchor="middle">ML/AI</text>

    <!-- Java -->
    <rect x="148" y="-14" width="44" height="22" rx="11" fill="#ED8B00" opacity="0.2"/>
    <text x="170" y="2" font-family="'Segoe UI', sans-serif" font-size="10" fill="#e3b341" text-anchor="middle">Java</text>

    <!-- C/C++ -->
    <rect x="202" y="-14" width="48" height="22" rx="11" fill="#00599C" opacity="0.2"/>
    <text x="226" y="2" font-family="'Segoe UI', sans-serif" font-size="10" fill="#79c0ff" text-anchor="middle">C/C++</text>

    <!-- Git -->
    <rect x="260" y="-14" width="38" height="22" rx="11" fill="#F05032" opacity="0.2"/>
    <text x="279" y="2" font-family="'Segoe UI', sans-serif" font-size="10" fill="#f97583" text-anchor="middle">Git</text>

    <!-- VS Code -->
    <rect x="308" y="-14" width="62" height="22" rx="11" fill="#007ACC" opacity="0.2"/>
    <text x="339" y="2" font-family="'Segoe UI', sans-serif" font-size="10" fill="#79c0ff" text-anchor="middle">VS Code</text>
  </g>

  <!-- Bottom accent -->
  <text x="415" y="105" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="10" fill="#484f58" text-anchor="middle" letter-spacing="3">
    ✦  OPEN TO COLLABORATE  ✦
  </text>
</svg>
