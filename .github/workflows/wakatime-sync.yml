name: Live Profile Telemetry & WakaTime Sync

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  sync-telemetry:
    name: Sync Live WakaTime & GitHub Language Metrics
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync WakaTime Coding Telemetry
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          python scripts/update-wakatime.py

      - name: Sync GitHub Repository Languages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update-languages.py

      - name: Commit & Push Updated Visual Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/wakatime.svg assets/languages.svg
          if git diff --staged --quiet; then
            echo "No changes in telemetry metrics."
          else
            git commit -m "📊 sync live WakaTime telemetry & language metrics [skip ci]"
            git push origin main
          fi
