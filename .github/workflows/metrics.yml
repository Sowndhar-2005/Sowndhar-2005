# yaml-language-server: $schema=none
# GitHub Metrics — Auto-generate SVG infographics for your profile
# Based on https://github.com/lowlighter/metrics

name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push:
    branches: [main]

jobs:

  # ═══════════════════════════════════════════════════════════
  # 📊 Left Column — Base Header + Introduction + Topics + Languages + WakaTime + Habits + Calendar
  # ═══════════════════════════════════════════════════════════
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📊 General Metrics
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}

          # ═══ User info ═══
          user: Sowndhar-2005
          template: classic
          config_timezone: Asia/Kolkata

          # Section order: Header → About Me → Starred Topics (Icons) → Languages → WakaTime → Lines of Code → Calendar
          config_order: base.header, introduction, topics, languages, wakatime, lines, isocalendar

          # ═══ Base content (Header with hireable badge) ═══
          base: header
          base_hireable: yes

          # ═══ Custom About Me Section ═══
          plugin_introduction: yes
          plugin_introduction_title: yes

          # ═══ Starred Topics (with Icons) ═══
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 0
          plugin_topics_sort: stars

          # ═══ Most Used Languages ═══
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          # ═══ WakaTime ═══
          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
          plugin_wakatime_days: 7
          plugin_wakatime_sections: time, projects, projects-graphs, languages, languages-graphs, editors, os
          plugin_wakatime_limit: 5

          # ═══ Lines of Code ═══
          plugin_lines: yes

          # ═══ Contribution Calendar (isometric 3D) ═══
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          extras_css: |
            .topics img {
              width: 36px !important;
              height: 36px !important;
              margin: 6px !important;
            }
            /* Hide fetched GitHub bio and show custom bio */
            .introduction .description {
              display: none !important;
            }
            .introduction::after {
              content: "I'm an AI & Machine Learning Engineering student passionate about building intelligent applications, modern web experiences, and cross-platform software. I enjoy working across full-stack development, AI/ML, UI/UX design, and cloud technologies to create practical, scalable solutions. I continuously learn new technologies, solve coding challenges, contribute to personal and open-source projects, and strive to grow as a software engineer. I'm always excited to explore emerging technologies, collaborate with others, and turn innovative ideas into real-world applications.";
              display: block;
              font-size: 13px;
              line-height: 1.5;
              color: #c9d1d9;
              margin-top: 8px;
            }

  # ═══════════════════════════════════════════════════════════
  # 🦑 Right Column — Repos + Anilist + Music
  # ═══════════════════════════════════════════════════════════
  medias:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🦑 Medias & Projects
        uses: lowlighter/metrics@latest
        with:
          filename: medias.svg
          token: ${{ secrets.METRICS_TOKEN }}

          # ═══ User info ═══
          user: Sowndhar-2005
          template: classic
          config_timezone: Asia/Kolkata
          config_order: repositories, anilist, music

          # ═══ No base content ═══
          base: ""

          # ═══ Featured Repositories (your 3 projects) ═══
          plugin_repositories: yes
          plugin_repositories_featured: Sowndhar-2005/the-Honored-One, Sowndhar-2005/Student-Performance-Analysis-Dashboard, Sowndhar-2005/DrugGuard-Detection-System

          # ═══ Anilist (anime & manga) ═══
          plugin_anilist: yes
          plugin_anilist_user: Master466
          plugin_anilist_medias: anime
          plugin_anilist_sections: favorites, characters
          plugin_anilist_limit: 2
          plugin_anilist_limit_characters: 22

          # ═══ Music (YouTube Music playlist) ═══
          plugin_music: yes
          plugin_music_provider: youtube
          plugin_music_mode: playlist
          plugin_music_playlist: https://music.youtube.com/playlist?list=PLGxDBKgU66aU&si=i3QZ7PCSdba_-XwJ
          plugin_music_limit: 4
