# yaml-language-server: $schema=none
# GitHub Metrics — Auto-generate SVG infographics for your profile
# Based on https://github.com/lowlighter/metrics

name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push:
    branches: [main]

jobs:

  # ═══════════════════════════════════════════════════════════
  # 📊 Left Column — Header + Languages + WakaTime
  # ═══════════════════════════════════════════════════════════
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Metrics embed
        uses: lowlighter/metrics@v3.34
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}

          # ═══ User info ═══
          user: Sowndhar-2005
          template: classic
          config_timezone: Asia/Kolkata

          # Section order
          config_order: base.header, languages, wakatime

          # ═══ Base content (Header with hireable badge) ═══
          base: header
          base_hireable: yes

          # ═══ Languages (Most Used + Recently Used) ═══
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used, recently-used
          plugin_languages_threshold: 0%

          # ═══ WakaTime ═══
          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
          plugin_wakatime_days: 7
          plugin_wakatime_sections: time, projects, projects-graphs, languages, languages-graphs, editors, os
          plugin_wakatime_limit: 5

  # ═══════════════════════════════════════════════════════════
  # 🦑 Right Column — Featured Repos + Contribution Calendar
  # ═══════════════════════════════════════════════════════════
  medias:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Metrics embed
        uses: lowlighter/metrics@v3.34
        with:
          filename: medias.svg
          token: ${{ secrets.METRICS_TOKEN }}

          # ═══ User info ═══
          user: Sowndhar-2005
          template: classic
          config_timezone: Asia/Kolkata
          config_order: repositories, isocalendar

          # ═══ No base content ═══
          base: ""

          # ═══ Featured Repositories ═══
          plugin_repositories: yes
          plugin_repositories_featured: Sowndhar-2005/Campus-Canteen, Sowndhar-2005/Student-Performance-Analysis-Dashboard, Sowndhar-2005/DrugGuard-Detection-System

          # ═══ Contribution Calendar (isometric 3D) ═══
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
